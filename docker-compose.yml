version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: vortex-db
    environment:
      POSTGRES_USER: vortex
      POSTGRES_PASSWORD: vortex
      POSTGRES_DB: vortexhealing
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vortex-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vortex-api
    environment:
      DATABASE_URL: postgresql://vortex:vortex@postgres:5432/vortexhealing
      LM_STUDIO_URL: http://host.docker.internal:1234/v1
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    networks:
      - vortex-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vortex-ui
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - vortex-network

volumes:
  postgres_data:

networks:
  vortex-network:
